name: Publish Python 🐍 distribution 📦 to PyPI
# https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/#the-whole-ci-cd-workflow

on:
  push:
    tags: ["v*"]

jobs:
  test:
    name: Run the tests 🧪
    uses: ./.github/workflows/tests.yml

  build:
    name: Build distribution 📦
    needs:
    - test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0 # hatch-vcs reads the version from the git tag
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.x"
    - name: Install pypa/build
      run: >-
        python3 -m
        pip install
        build
        --user
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Store the distribution packages
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/grouptok
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  changelog:
    name: Update CHANGELOG.md 📝
    needs:
    - publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push the changelog commit

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.repository.default_branch }}
        fetch-depth: 0  # auto-changelog needs the full history and all tags
        # persist-credentials stays on here: the push below needs it
    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: lts/*
    - name: Generate the changelog
      run: npx --yes auto-changelog
    - name: Commit and push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add CHANGELOG.md
        git diff --cached --quiet || git commit -m "docs: changelog for ${GITHUB_REF_NAME}"
        git push

  github-release:
    name: Create GitHub release 🏷️
    needs:
    - changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release and upload the dists

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/
    - name: Create the release with the dists attached
      env:
        GH_TOKEN: ${{ github.token }}
      run: >-
        gh release create "$GITHUB_REF_NAME" dist/*
        --repo "$GITHUB_REPOSITORY"
        --verify-tag
        --generate-notes
