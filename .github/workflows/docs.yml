name: Docs 📚

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write     # deploy to GitHub Pages
  id-token: write  # verify the deployment comes from this workflow

concurrency:  # one deployment at a time; a newer push waits rather than cancelling a deployment midway
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy the docs site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install the docs extra
        run: python -m pip install ".[docs]"
      - name: Build the site
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@v5
